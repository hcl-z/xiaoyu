      - paragraph [ref=f3e10]: 三层结构：Tokens（颜色 / 字阶 / 圆角 / 间距 / 阴影 / 动效，唯一真源）→ Components（页面只能组合这里导出的积木）→ Pages（只做组合与数据编排）。 全部页面遵循同一条版式规则：灰底 + 悬浮白卡 + 发丝描边与极轻落影，列表用 18 圆角分组、行内分隔线在左侧缩进； 导航只有 Large Title（Tab 根页）、紧凑导航条（Push 页）、弹层（Modal）三种。
