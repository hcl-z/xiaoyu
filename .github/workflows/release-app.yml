# Releases the phone app (apps/expo-app). Run by hand from the Actions tab, on the branch it
# should build: it drafts the release mobile-vX.Y.Z of this repository, after the version in
# apps/expo-app/app.json, with the version's section of CHANGELOG.md as its notes, then builds the
# Android APK, signed with the release keystore, and an unsigned iPhone .ipa, which a sideloading
# tool signs with the user's own Apple ID, and uploads both to the draft; the tag appears when the
# draft is published. Publishing the draft makes it the update Android apps install.
name: Release phone app

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: What to release
        type: choice
        options: [iOS and Android, iOS, Android]
        default: iOS and Android

permissions:
  contents: read

# One run at a time, so two runs never upload to the same release.
concurrency:
  group: release-mobile

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.app.outputs.version }}
      tag: ${{ steps.app.outputs.tag }}
      ios: ${{ steps.app.outputs.ios }}
      android: ${{ steps.app.outputs.android }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: app
        name: Name the release after apps/expo-app/app.json
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          version=$(node -p "require('./apps/expo-app/app.json').expo.version")
          tag=mobile-v$version
          ios=true
          android=true
          case $PLATFORMS in
            iOS) android=false ;;
            Android) ios=false ;;
          esac
          # A release takes the tag that exists, so the build has to come from its commit.
          if tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null) && [[ $tagged != "$GITHUB_SHA" ]]; then
            echo "::error::$tag already tags $tagged: run this on that commit, or bump version in apps/expo-app/app.json"
            exit 1
          fi
          # This job's token cannot see drafts; the draft job takes an earlier run's draft.
          if [[ $(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null) == false ]]; then
            echo "::error::$tag is already published: bump version in apps/expo-app/app.json"
            exit 1
          fi
          node scripts/require-release-notes.mjs "$version"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "ios=$ios"
            echo "android=$android"
          } >> "$GITHUB_OUTPUT"

  # The builds upload into one draft, which this job makes first; each would make its own.
  draft:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Draft ${{ needs.version.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if ! state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null); then
            state=none
          fi
          case $state in
            published)
              echo "::error::$TAG was published while this ran, so it stays as it is"
              exit 1
              ;;
            draft)
              # An earlier run's draft takes these builds, from this commit, and keeps its notes.
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
              ;;
            none)
              node scripts/release-notes.mjs "$VERSION" > notes.md
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --latest=false --target "$GITHUB_SHA" --title "daily+ for iPhone and Android $VERSION" --notes-file notes.md
              ;;
          esac

  ios:
    name: iOS to GitHub
    needs: [version, draft]
    if: needs.version.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: node scripts/release-ios.mjs
      - name: Upload to ${{ needs.version.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$TAG" "dist/ios/daily-*-ios.ipa" --repo "$GITHUB_REPOSITORY" --clobber

  android:
    name: Android to GitHub
    needs: [version, draft]
    if: needs.version.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # Gradle's caches between runs; the project itself is generated by each build.
      - uses: gradle/actions/setup-gradle@v6
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z $KEYSTORE || -z $ANDROID_KEYSTORE_PASSWORD ]]; then
            echo "::error::the ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD secrets are missing: README has the setup"
            exit 1
          fi
          umask 077
          export ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore
          base64 --decode <<<"$KEYSTORE" > "$ANDROID_KEYSTORE"
          trap 'rm -f "$ANDROID_KEYSTORE"' EXIT
          node scripts/release-android.mjs
      - name: Upload to ${{ needs.version.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$TAG" "dist/android/daily-*-android.apk" --repo "$GITHUB_REPOSITORY" --clobber
