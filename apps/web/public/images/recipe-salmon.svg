<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="香煎三文鱼配芦笋">
  <!-- 氛围底：冷调雾蓝 -->
  <rect width="800" height="600" fill="#E9EEF2"/>
  <circle cx="400" cy="322" r="236" fill="#F0F4F7"/>
  <circle cx="668" cy="452" r="44" fill="#DFE7ED"/>
  <circle cx="120" cy="180" r="30" fill="#DFE7ED"/>

  <!-- 平盘投影 -->
  <ellipse cx="400" cy="484" rx="212" ry="22" fill="#33414E" opacity="0.12"/>

  <!-- 白瓷平盘 -->
  <ellipse cx="400" cy="420" rx="248" ry="66" fill="#FFFFFF"/>
  <ellipse cx="400" cy="412" rx="248" ry="64" fill="#FDFEFF"/>
  <ellipse cx="400" cy="408" rx="196" ry="48" fill="#F1F4F7"/>
  <ellipse cx="400" cy="406" rx="184" ry="44" fill="#FBFCFE"/>
  <!-- 盘沿高光 -->
  <path d="M186 400 q40 40 110 56" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>

  <!-- 食物整体重心左移，给柠檬角留出右侧空间 -->
  <g transform="translate(-14 0)">
    <!-- 芦笋打底 -->
    <g stroke-linecap="round">
      <path d="M248 402 L392 340" stroke="#9DBF6E" stroke-width="15"/>
      <path d="M256 414 L400 352" stroke="#7BA05B" stroke-width="15"/>
      <path d="M268 424 L412 362" stroke="#6C9450" stroke-width="15"/>
      <path d="M244 398 L250 380" stroke="#B7D18C" stroke-width="8"/>
      <path d="M252 410 L258 392" stroke="#A9C97E" stroke-width="8"/>
      <!-- 露尖的一根：从鱼排左缘探出头 -->
      <path d="M240 432 L340 350" stroke="#8FB06A" stroke-width="15"/>
      <path d="M328 348 q10 -16 26 -18 q-2 18 -16 26 Z" fill="#9DBF6E"/>
    </g>

    <!-- 三文鱼排（脆皮朝上） -->
    <g>
      <path d="M356 350 C384 316 470 292 540 300 C586 306 610 326 606 352 C602 380 560 402 496 408 C432 414 384 398 368 374 C360 364 356 356 356 350 Z" fill="#E76F51"/>
      <!-- 香脆表皮：焦化纹理 -->
      <path d="M362 346 C390 314 472 292 538 300 C580 305 604 324 601 348 C598 372 560 394 498 400 C440 406 388 392 366 362 Z" fill="#C75B3E"/>
      <g stroke="#A34A30" stroke-width="5" stroke-linecap="round" fill="none">
        <path d="M398 330 q52 -14 106 -12"/>
        <path d="M386 348 q64 -16 130 -10"/>
        <path d="M406 368 q56 -12 112 -6"/>
        <path d="M436 384 q44 -8 88 -2"/>
      </g>
      <!-- 鱼肉侧切面（完全在轮廓内的浅橙层） -->
      <path d="M374 362 C398 390 448 402 494 398 C486 404 462 408 440 407 C414 406 390 392 374 362 Z" fill="#F08A5D"/>
      <path d="M388 372 q36 20 88 24" fill="none" stroke="#F5A97E" stroke-width="5" stroke-linecap="round"/>
      <!-- 表皮高光 -->
      <path d="M420 312 q44 -8 84 -2" fill="none" stroke="#DD7A57" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- 黑胡椒粒 -->
    <g fill="#4A3B33">
      <circle cx="452" cy="392" r="3.4"/>
      <circle cx="500" cy="384" r="3"/>
      <circle cx="540" cy="368" r="3.2"/>
      <circle cx="414" cy="376" r="2.8"/>
    </g>
    <!-- 融化黄油 -->
    <ellipse cx="566" cy="398" rx="20" ry="7" fill="#F9DFA0" opacity="0.9"/>
  </g>

  <!-- 柠檬角（收进盘沿内） -->
  <g transform="translate(584 350) rotate(18)">
    <path d="M0 0 a40 40 0 0 1 56 -36 l-22 52 Z" fill="#F5C652"/>
    <path d="M8 -2 a30 30 0 0 1 42 -27 l-4 7 a23 23 0 0 0 -32 20 Z" fill="#FBE29A"/>
    <path d="M6 4 l-6 -13" stroke="#E8B23B" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
