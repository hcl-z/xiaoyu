<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="味噌奶油蘑菇意面">
  <!-- 氛围底：暖米色 -->
  <rect width="800" height="600" fill="#F3EDE3"/>
  <circle cx="400" cy="322" r="236" fill="#F7F2E9"/>
  <circle cx="672" cy="436" r="42" fill="#EDE4D5"/>
  <circle cx="122" cy="168" r="30" fill="#EDE4D5"/>

  <!-- 背景点缀：两枚口蘑 -->
  <g transform="translate(158 236)">
    <path d="M0 44 a26 26 0 0 1 52 0 Z" fill="#C7A582"/>
    <rect x="16" y="42" width="20" height="22" rx="8" fill="#EFE7D8"/>
    <ellipse cx="16" cy="28" rx="4.5" ry="3" fill="#EFE7D8"/>
    <ellipse cx="34" cy="18" rx="5" ry="3.4" fill="#EFE7D8"/>
  </g>
  <g transform="translate(638 250) rotate(12)">
    <path d="M0 38 a22 22 0 0 1 44 0 Z" fill="#B08968"/>
    <rect x="14" y="36" width="16" height="18" rx="7" fill="#EFE7D8"/>
  </g>

  <!-- 碗投影 -->
  <ellipse cx="400" cy="512" rx="182" ry="24" fill="#4E3A24" opacity="0.12"/>

  <!-- 陶碗（焦糖釉） -->
  <path d="M186 300 C196 406 284 486 400 486 C516 486 604 406 614 300 Z" fill="#C98B4E"/>
  <path d="M186 300 C196 406 284 486 400 486 C426 486 450 483 474 478 C388 466 318 418 304 300 Z" fill="#D89C5F"/>
  <path d="M342 484 h116 a10 10 0 0 1 10 12 l-4 14 h-128 l-4 -14 a10 10 0 0 1 10 -12 Z" fill="#B27940"/>
  <path d="M208 318 C226 374 280 424 348 446" fill="none" stroke="#E7B87E" stroke-width="9" stroke-linecap="round" opacity="0.8"/>

  <!-- 碗口：唇沿（浅釉）→ 内壁（深釉） -->
  <ellipse cx="400" cy="300" rx="214" ry="42" fill="#D89C5F"/>
  <ellipse cx="400" cy="300" rx="198" ry="35" fill="#B27940"/>

  <!-- 奶油意面 -->
  <ellipse cx="400" cy="297" rx="182" ry="33" fill="#F5EBD8"/>
  <!-- 面条卷 -->
  <g fill="none" stroke="#EEDFC4" stroke-width="9" stroke-linecap="round">
    <path d="M262 292 q34 -22 76 -12"/>
    <path d="M348 278 q40 -16 82 -4"/>
    <path d="M446 280 q40 -8 72 12"/>
    <path d="M286 306 q44 -14 90 -4"/>
    <path d="M418 304 q42 -8 80 6"/>
  </g>
  <g fill="none" stroke="#F8F1E2" stroke-width="7" stroke-linecap="round">
    <path d="M304 264 q38 -18 80 -8"/>
    <path d="M424 260 q42 -6 74 14"/>
  </g>
  <!-- 味噌酱汁光泽 -->
  <ellipse cx="390" cy="306" rx="116" ry="11" fill="#E4C9A0" opacity="0.65"/>
  <ellipse cx="370" cy="300" rx="62" ry="7" fill="#FFFFFF" opacity="0.35"/>

  <!-- 蘑菇片（全部收进碗口内） -->
  <g>
    <g transform="translate(306 258) rotate(-14)">
      <ellipse cx="0" cy="0" rx="26" ry="20" fill="#B08968"/>
      <ellipse cx="0" cy="0" rx="17" ry="12" fill="#D6B896"/>
      <ellipse cx="0" cy="0" rx="7" ry="5" fill="#B08968"/>
    </g>
    <g transform="translate(432 268) rotate(18)">
      <ellipse cx="0" cy="0" rx="22" ry="17" fill="#8C6A4A"/>
      <ellipse cx="0" cy="0" rx="14" ry="10" fill="#C7A582"/>
      <ellipse cx="0" cy="0" rx="6" ry="4" fill="#8C6A4A"/>
    </g>
    <g transform="translate(346 300) rotate(30)">
      <ellipse cx="0" cy="0" rx="16" ry="12" fill="#9A7554"/>
      <ellipse cx="0" cy="0" rx="10" ry="7" fill="#C7A582"/>
    </g>
    <g transform="translate(500 302) rotate(-8)">
      <ellipse cx="0" cy="0" rx="16" ry="12" fill="#B08968"/>
      <ellipse cx="0" cy="0" rx="10" ry="7" fill="#D6B896"/>
    </g>
  </g>
  <!-- 黑胡椒与欧芹 -->
  <g fill="#4A3B33">
    <circle cx="392" cy="252" r="3.2"/>
    <circle cx="466" cy="254" r="2.8"/>
    <circle cx="332" cy="284" r="2.6"/>
  </g>
  <path d="M398 288 q4 -12 16 -14 q-2 14 -12 18 Z" fill="#7BA05B"/>
  <path d="M350 268 q4 -10 14 -12 q-2 12 -10 15 Z" fill="#8FB06A"/>

  <!-- 叉子搭在碗沿 -->
  <g stroke="#C89F6B" stroke-linecap="round">
    <path d="M566 244 L722 190" stroke-width="10"/>
    <path d="M700 196 l22 -8 M688 190 l20 -7 M676 184 l18 -7" stroke-width="6"/>
  </g>

  <!-- 蒸汽 -->
  <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.5">
    <path d="M340 182 q-13 -20 0 -40 q12 -19 0 -38"/>
    <path d="M408 172 q-12 -19 0 -38 q11 -18 0 -36"/>
    <path d="M474 186 q-11 -17 0 -34 q10 -16 0 -32"/>
  </g>
</svg>
