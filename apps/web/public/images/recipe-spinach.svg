<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="麻油拌菠菜">
  <!-- 氛围底：淡玉绿 -->
  <rect width="800" height="600" fill="#EAF1E4"/>
  <circle cx="400" cy="322" r="236" fill="#EFF5EA"/>
  <circle cx="662" cy="150" r="40" fill="#DFEADC"/>
  <circle cx="128" cy="470" r="34" fill="#DFEADC"/>

  <!-- 背景点缀：白芝麻与叶 -->
  <g fill="#FFFFFF">
    <ellipse cx="150" cy="252" rx="7" ry="4" transform="rotate(-18 150 252)"/>
    <ellipse cx="178" cy="282" rx="5.5" ry="3.2" transform="rotate(24 178 282)"/>
  </g>
  <path d="M636 268 q22 -6 34 8 q-20 10 -34 -8 Z" fill="#9DBF6E"/>

  <!-- 碗投影 -->
  <ellipse cx="400" cy="510" rx="168" ry="22" fill="#2F4227" opacity="0.12"/>

  <!-- 白瓷碗（敞口） -->
  <path d="M198 296 C210 400 292 478 400 478 C508 478 590 400 602 296 Z" fill="#FFFFFF"/>
  <path d="M198 296 C210 400 292 478 400 478 C424 478 446 476 468 471 C388 458 316 412 300 296 Z" fill="#F4F6F3"/>
  <path d="M344 478 h112 a10 10 0 0 1 10 12 l-4 12 h-128 l-4 -12 a10 10 0 0 1 10 -12 Z" fill="#E4E8E2"/>
  <!-- 碗沿高光 -->
  <path d="M222 312 C240 366 292 414 354 438" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <!-- 碗身细青纹（贴近下缘的釉线） -->
  <path d="M272 428 q128 42 256 0" fill="none" stroke="#C9D8C2" stroke-width="6" stroke-linecap="round"/>

  <!-- 碗口：唇沿（白）→ 内壁（灰绿） -->
  <ellipse cx="400" cy="296" rx="202" ry="40" fill="#FFFFFF"/>
  <ellipse cx="400" cy="296" rx="186" ry="33" fill="#E4E8E2"/>

  <!-- 拌好的菠菜段（堆叠的深绿叶片） -->
  <g>
    <ellipse cx="400" cy="292" rx="170" ry="30" fill="#3E6B41"/>
    <!-- 叶束层次 -->
    <path d="M254 288 q8 -34 44 -36 q6 -26 40 -26 q20 -18 48 -10 q28 -14 56 4 q30 -4 44 24 q24 10 20 34 l-252 8 Z" fill="#557A4E"/>
    <path d="M288 272 q20 -22 48 -16 q10 -18 34 -14 q22 -12 44 4 q24 -2 32 22 l-158 4 Z" fill="#4E7448"/>
    <!-- 叶面高光 -->
    <path d="M308 262 q26 -14 52 -8" fill="none" stroke="#6E9764" stroke-width="6" stroke-linecap="round"/>
    <path d="M420 258 q28 -6 46 10" fill="none" stroke="#6E9764" stroke-width="6" stroke-linecap="round"/>
    <path d="M356 248 q30 -12 58 0" fill="none" stroke="#79A36D" stroke-width="5" stroke-linecap="round"/>
    <!-- 深绿过渡叶（弱化左上交界切线） -->
    <path d="M282 278 q30 -20 62 -14 q-8 24 -34 30 q-24 4 -28 -16 Z" fill="#466E40"/>
    <!-- 麻油光泽 -->
    <ellipse cx="396" cy="302" rx="120" ry="11" fill="#FFFFFF" opacity="0.12"/>
  </g>
  <!-- 白芝麻 -->
  <g fill="#FBF7EC">
    <ellipse cx="332" cy="286" rx="5.4" ry="3" transform="rotate(-20 332 286)"/>
    <ellipse cx="398" cy="292" rx="5" ry="2.8" transform="rotate(16 398 292)"/>
    <ellipse cx="450" cy="282" rx="5.2" ry="2.9" transform="rotate(-8 450 282)"/>
    <ellipse cx="366" cy="270" rx="4.4" ry="2.5" transform="rotate(28 366 270)"/>
    <ellipse cx="474" cy="294" rx="4.6" ry="2.6" transform="rotate(-24 474 294)"/>
  </g>

  <!-- 筷子夹起一撮菠菜（近乎平行） -->
  <g stroke="#C89F6B" stroke-width="9" stroke-linecap="round">
    <path d="M538 250 L714 188"/>
    <path d="M548 274 L722 214"/>
  </g>
  <path d="M512 260 q34 -10 58 8 q-8 26 -40 24 q-28 -6 -18 -32 Z" fill="#557A4E"/>
  <path d="M524 264 q20 -6 34 4" fill="none" stroke="#79A36D" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="548" cy="284" rx="4.6" ry="2.6" fill="#FBF7EC" transform="rotate(14 548 284)"/>

  <!-- 淡蒸汽（凉拌少一些，若有似无） -->
  <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.34">
    <path d="M362 190 q-12 -18 0 -36 q11 -17 0 -34"/>
    <path d="M438 198 q-11 -17 0 -34 q10 -16 0 -32"/>
  </g>
</svg>
