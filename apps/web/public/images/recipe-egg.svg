<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="虾皮蒸蛋">
  <!-- 氛围底：柔和蛋奶黄 -->
  <rect width="800" height="600" fill="#FBF3DC"/>
  <circle cx="400" cy="322" r="236" fill="#FCF6E4"/>
  <circle cx="668" cy="140" r="42" fill="#F6EBCB"/>
  <circle cx="126" cy="472" r="34" fill="#F6EBCB"/>

  <!-- 背景点缀：青瓷小碟与蛋壳 -->
  <g transform="translate(158 300)">
    <ellipse cx="0" cy="26" rx="52" ry="14" fill="#FFFFFF"/>
    <ellipse cx="0" cy="22" rx="52" ry="13" fill="#EAF1E4"/>
    <path d="M-26 12 a26 12 0 0 1 52 0" fill="#D5E3CD"/>
  </g>
  <g transform="translate(648 320) rotate(-16)">
    <path d="M0 0 a22 26 0 0 1 42 -6 l-6 34 a22 26 0 0 1 -40 2 Z" fill="#FFF6E3"/>
    <path d="M42 -6 a22 26 0 0 0 -26 -18 a22 26 0 0 1 26 18" fill="#F3E5C4"/>
  </g>

  <!-- 碗投影 -->
  <ellipse cx="400" cy="512" rx="170" ry="22" fill="#5A4A28" opacity="0.11"/>

  <!-- 深口白瓷碗 -->
  <path d="M196 288 C210 402 296 484 400 484 C504 484 590 402 604 288 Z" fill="#FFFFFF"/>
  <path d="M196 288 C210 402 296 484 400 484 C428 484 454 480 478 474 C392 462 318 410 304 288 Z" fill="#F3F1EA"/>
  <path d="M344 482 h112 a10 10 0 0 1 10 12 l-4 14 h-128 l-4 -14 a10 10 0 0 1 10 -12 Z" fill="#E7E4DB"/>
  <path d="M220 306 C240 368 296 422 360 444" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.95"/>

  <!-- 碗口：唇沿（白）→ 内壁（暖灰） -->
  <ellipse cx="400" cy="288" rx="204" ry="40" fill="#FFFFFF"/>
  <ellipse cx="400" cy="288" rx="188" ry="33" fill="#E7E4DB"/>

  <!-- 蒸蛋：镜面 -->
  <ellipse cx="400" cy="288" rx="176" ry="31" fill="#F8DFA0"/>
  <!-- 镜面高光（小镜子） -->
  <ellipse cx="358" cy="280" rx="68" ry="11" fill="#FCEBBE"/>
  <ellipse cx="452" cy="294" rx="38" ry="7" fill="#FCEBBE"/>
  <path d="M310 276 q28 -10 58 -6" fill="none" stroke="#FFF3D2" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <!-- 边缘微皱（只贴着左右边缘，不穿过中部） -->
  <path d="M252 304 q56 16 118 12" fill="none" stroke="#F2D489" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M430 316 q60 6 118 -8" fill="none" stroke="#F2D489" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <!-- 虾皮撒面 -->
  <g fill="#F2A47E">
    <ellipse cx="342" cy="286" rx="8" ry="4" transform="rotate(-14 342 286)"/>
    <ellipse cx="388" cy="292" rx="7" ry="3.6" transform="rotate(18 388 292)"/>
    <ellipse cx="434" cy="282" rx="7.4" ry="3.8" transform="rotate(-6 434 282)"/>
    <ellipse cx="464" cy="294" rx="6.4" ry="3.2" transform="rotate(26 464 294)"/>
    <ellipse cx="312" cy="296" rx="6" ry="3" transform="rotate(-22 312 296)"/>
    <ellipse cx="494" cy="288" rx="6.2" ry="3.1" transform="rotate(8 494 288)"/>
    <ellipse cx="408" cy="270" rx="6.6" ry="3.3" transform="rotate(-10 408 270)"/>
  </g>
  <g fill="#E8875E">
    <ellipse cx="366" cy="278" rx="4.4" ry="2.4" transform="rotate(12 366 278)"/>
    <ellipse cx="452" cy="276" rx="4" ry="2.2" transform="rotate(-18 452 276)"/>
  </g>
  <!-- 葱花与香油亮点 -->
  <g stroke="#7BA05B" stroke-width="4" stroke-linecap="round">
    <path d="M378 284 h8"/>
    <path d="M446 290 h8"/>
    <path d="M332 300 h7"/>
  </g>
  <ellipse cx="420" cy="298" rx="10" ry="3.4" fill="#FFE9A8" opacity="0.9"/>
  <ellipse cx="352" cy="294" rx="7" ry="2.6" fill="#FFE9A8" opacity="0.85"/>

  <!-- 瓷勺搁在碗沿 -->
  <g transform="translate(556 252) rotate(26)">
    <ellipse cx="0" cy="0" rx="26" ry="19" fill="#FFFFFF"/>
    <ellipse cx="0" cy="0" rx="16" ry="11" fill="#F3F1EA"/>
    <path d="M22 8 L84 40" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>
    <path d="M22 8 L84 40" stroke="#E9E6DD" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="-7" cy="-6" rx="8" ry="4" fill="#FCFAF4"/>
  </g>

  <!-- 蒸汽（蒸菜要足） -->
  <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.6">
    <path d="M330 176 q-14 -22 0 -44 q13 -21 0 -42"/>
    <path d="M402 166 q-13 -20 0 -40 q12 -19 0 -38"/>
    <path d="M472 178 q-12 -19 0 -38 q11 -18 0 -36"/>
  </g>
</svg>
