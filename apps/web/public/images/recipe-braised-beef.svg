<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="番茄牛腩饭">
  <!-- 氛围底：暖奶油色 + 柔光晕 -->
  <rect width="800" height="600" fill="#F6E8DC"/>
  <circle cx="400" cy="322" r="236" fill="#F9EFE2"/>
  <circle cx="132" cy="150" r="42" fill="#F0DECD"/>

  <!-- 背景点缀：一颗小番茄 -->
  <circle cx="150" cy="252" r="17" fill="#D65A3C"/>
  <path d="M150 230 q6 -14 18 -16" fill="none" stroke="#6F8F5A" stroke-width="4" stroke-linecap="round"/>

  <!-- 碗投影 -->
  <ellipse cx="400" cy="516" rx="188" ry="24" fill="#4A2E20" opacity="0.12"/>

  <!-- 陶碗（茶红釉） -->
  <path d="M176 300 C182 408 274 486 400 486 C526 486 618 408 624 300 Z" fill="#B34A32"/>
  <path d="M176 300 C182 408 274 486 400 486 C430 486 458 483 484 477 C396 468 318 420 300 300 Z" fill="#C4573B"/>
  <!-- 碗足 -->
  <path d="M340 484 h112 a10 10 0 0 1 10 12 l-4 14 h-124 l-4 -14 a10 10 0 0 1 10 -12 Z" fill="#9E3F2B"/>
  <!-- 碗沿高光 -->
  <path d="M198 316 C214 372 268 420 336 442" fill="none" stroke="#DD7A57" stroke-width="10" stroke-linecap="round" opacity="0.7"/>

  <!-- 碗口：唇沿（浅）→ 内壁（深） -->
  <ellipse cx="400" cy="300" rx="224" ry="44" fill="#C4573B"/>
  <ellipse cx="400" cy="300" rx="208" ry="37" fill="#9E3F2B"/>
  <!-- 米饭 -->
  <ellipse cx="400" cy="297" rx="190" ry="33" fill="#FFF6E9"/>
  <path d="M248 288 q26 -30 58 -18 q10 -34 48 -30 q18 -26 52 -18 q30 -22 62 -2 q34 -10 50 22 q28 4 32 30 l-302 6 Z" fill="#FFFDF7"/>
  <ellipse cx="318" cy="276" rx="42" ry="15" fill="#FFF9F0"/>
  <ellipse cx="450" cy="282" rx="36" ry="13" fill="#FFF9F0"/>

  <!-- 浇头：番茄牛腩块 -->
  <g>
    <path d="M290 262 q10 -26 44 -24 q30 2 36 26 q4 22 -18 30 l-42 2 q-24 -6 -20 -34 Z" fill="#A63A26"/>
    <path d="M304 250 q12 -14 32 -12 q16 2 20 16" fill="none" stroke="#C4573B" stroke-width="5" stroke-linecap="round"/>
    <path d="M386 248 q14 -22 44 -16 q26 6 26 30 q0 20 -24 26 l-38 -2 q-18 -10 -8 -38 Z" fill="#8E2F1F"/>
    <path d="M398 240 q12 -10 28 -8" fill="none" stroke="#B34A32" stroke-width="5" stroke-linecap="round"/>
    <path d="M340 292 q16 -18 42 -14 q24 4 26 24 q0 16 -20 22 l-32 -2 q-22 -8 -16 -30 Z" fill="#B34A32"/>
    <path d="M354 282 q10 -8 24 -6" fill="none" stroke="#D65A3C" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- 番茄块 -->
  <g fill="#D65A3C">
    <circle cx="294" cy="296" r="15"/>
    <circle cx="498" cy="290" r="13"/>
    <circle cx="536" cy="304" r="9"/>
  </g>
  <circle cx="294" cy="296" r="7" fill="#E8836A"/>
  <circle cx="498" cy="290" r="6" fill="#E8836A"/>
  <!-- 酱汁光泽 -->
  <ellipse cx="392" cy="308" rx="126" ry="13" fill="#FFFFFF" opacity="0.14"/>
  <!-- 葱花 -->
  <g stroke="#6F8F5A" stroke-width="4.5" stroke-linecap="round">
    <path d="M362 300 h9"/>
    <path d="M418 294 h9"/>
    <path d="M458 306 h9"/>
    <path d="M326 306 h8"/>
  </g>

  <!-- 筷子搭在碗沿 -->
  <g stroke="#C89F6B" stroke-width="9" stroke-linecap="round">
    <path d="M556 268 L716 200"/>
    <path d="M566 292 L722 230"/>
  </g>

  <!-- 蒸汽 -->
  <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.55">
    <path d="M336 178 q-14 -22 0 -44 q13 -21 0 -42"/>
    <path d="M404 168 q-13 -20 0 -40 q12 -19 0 -38"/>
    <path d="M470 180 q-12 -19 0 -38 q11 -18 0 -36"/>
  </g>
</svg>
